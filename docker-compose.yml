services:
  # Certificate generator
  # Installs cfssl, builds the CA + server/client certificates from the cfssl
  # config files in ./setup/certs, and writes the results into the shared "certs"
  # volume. Every other service mounts that volume read-only at /certs.
  # It is idempotent: if the volume already holds certificates it exits 0
  # immediately, so it is safe to leave in the dependency graph.
  cert-generator:
    image: alpine:3.20
    container_name: cert-generator
    environment:
      # Comma-separated SANs baked into the server & client certificates.
      # Override from the host env (SERVER_HOSTNAMES=...) if you add services.
      SERVER_HOSTNAMES: ${SERVER_HOSTNAMES:-localhost,127.0.0.1,keycloak,rti-hmi,rti-bff,rti-fsp01,rti-fsp02,rti-so}
      CFSSL_VERSION: "1.6.5"
    volumes:
      - ./setup/certs:/config:ro
      - certs:/out
    working_dir: /out
    command:
      - sh
      - -eu
      - -c
      - |
        if [ -f /out/ca.pem ] && [ -f /out/server.pem ] && [ -f /out/client.pem ]; then
          echo "certificates already present in the 'certs' volume - nothing to do"
          exit 0
        fi

        echo "installing cfssl $${CFSSL_VERSION}..."
        apk add --no-cache curl ca-certificates >/dev/null
        base="https://github.com/cloudflare/cfssl/releases/download/v$${CFSSL_VERSION}"
        curl -fsSL -o /usr/local/bin/cfssl     "$${base}/cfssl_$${CFSSL_VERSION}_linux_amd64"
        curl -fsSL -o /usr/local/bin/cfssljson "$${base}/cfssljson_$${CFSSL_VERSION}_linux_amd64"
        chmod +x /usr/local/bin/cfssl /usr/local/bin/cfssljson

        cp /config/ca-config.json /config/ca-csr.json \
           /config/server-csr.json /config/client-csr.json /out/

        echo "generating CA..."
        cfssl gencert -initca ca-csr.json | cfssljson -bare ca

        echo "generating server certificate (SANs: $${SERVER_HOSTNAMES})..."
        cfssl gencert -ca=ca.pem -ca-key=ca-key.pem -config=ca-config.json \
          -profile=server -hostname="$${SERVER_HOSTNAMES}" \
          server-csr.json | cfssljson -bare server

        echo "generating client certificate..."
        cfssl gencert -ca=ca.pem -ca-key=ca-key.pem -config=ca-config.json \
          -profile=client -hostname="$${SERVER_HOSTNAMES}" \
          client-csr.json | cfssljson -bare client

        echo "generating keycloak certificate (SANs: $${SERVER_HOSTNAMES})..."
        cfssl gencert -ca=ca.pem -ca-key=ca-key.pem -config=ca-config.json \
          -profile=server -hostname="$${SERVER_HOSTNAMES}" \
          server-csr.json | cfssljson -bare keycloak

        chmod 644 /out/*.pem
        echo "certificates written to the 'certs' volume:"
        ls -1 /out/*.pem
    networks:
      - rti-network
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak-dev
    command: [ "start-dev", "--import-realm" ]
    ports:
      - "8081:8081"
      - "8443:8443"
    depends_on:
      cert-generator:
        condition: service_completed_successfully
    environment:
      KC_HOSTNAME: localhost
      # HTTP on 8081, inside and outside the container: 8080 is the rti-demo HMI.
      # One port everywhere keeps the token issuer the same for the host and
      # for containers (http://localhost:8081/realms/...).
      KC_HTTP_PORT: 8081
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTPS_CERTIFICATE_FILE: /certs/keycloak.pem
      KC_HTTPS_CERTIFICATE_KEY_FILE: /certs/keycloak-key.pem
    volumes:
      - ./modules/keycloak:/opt/keycloak/data/import
      - certs:/certs:ro
    networks:
      - rti-network


  # BFF Server
  rti-bff:
    image: ${RTI_IMAGE_REPO:-netbeheer-nederland/iec61850-websocket}/rti-bff:${RTI_IMAGE_TAG:-latest}
    container_name: rti-bff
    ports:
      - "3000:3000"
    depends_on:
      cert-generator:
        condition: service_completed_successfully
    environment:
#      RTI_DOCKER_ENABLED: true
#      RTI_SERVICE_DISCOVERY_ENABLED: true
      LOG_LEVEL: debug
      BFF_CONNECTIONS_FILE: "/config/connections.json"
      BFF_PLAYBOOKS_DIR: "/config/playbooks"
    volumes:
      - ./modules/bff/config:/config
      - ./playbooks:/app/examples/rti-demo/playbooks:ro
      - certs:/certs:ro
    networks:
      - rti-network
    labels:
      - "rti.service=rti-bff"
      - "rti.type=RTI-BFF"
      - "rti.host=rti-bff"
      - "rti.port=3000"

  # HMI Web Server
  rti-hmi:
    image: ${RTI_IMAGE_REPO:-netbeheer-nederland/iec61850-websocket}/rti-hmi:${RTI_IMAGE_TAG:-latest}
    container_name: rti-hmi
    ports:
      - "80:80"
    depends_on:
      rti-bff:
        condition: service_started
      cert-generator:
        condition: service_completed_successfully
    volumes:
      - certs:/certs:ro
    networks:
      - rti-network

  # RTI SO (Acsi-Client)
  rti-so:
    image: ${RTI_IMAGE_REPO:-netbeheer-nederland/iec61850-websocket}/rti-so:${RTI_IMAGE_TAG:-latest}
    container_name: rti-so
#    ports:
#      - "5000:5000"
#      - "8765:8765"    # WebSocket port - MUST ADD
    depends_on:
      cert-generator:
        condition: service_completed_successfully
    environment:
#      PORT: 5000
      LOG_LEVEL: debug
#      BFF_CONNECTIONS_FILE: /config/connections.json
#      BFF_PLAYBOOKS_DIR: /config/playbooks
    volumes:
      - certs:/certs:ro
    networks:
      - rti-network
    labels:
      - "rti.service=rti-so"
      - "rti.type=RTI-SO"
      - "rti.host=rti-so"
      - "rti.port=5000"


  # RTI-FSP (Acsi-Server)
  rti-fsp01:
    image: ${RTI_IMAGE_REPO:-netbeheer-nederland/iec61850-websocket}/rti-fsp:${RTI_IMAGE_TAG:-latest}
    container_name: rti-fsp01
    ports:
      - "5001:5001"
    depends_on:
      cert-generator:
        condition: service_completed_successfully
    environment:
      PORT: 5001
      CP: cp1
      LOG_LEVEL: debug
      MODELPATH: "/models/model_1.py"
      # The plugins it connects to: the dr-st7789v display, which needs
      # model_1.py's LD0/DWMX1.WMaxSpt and LD0/MMXU1.TotW. host_url in the
      # file is this FSP as the display reaches it: the published port 5001.
      PLUGINS_FILE: /plugins/plugins.json
    networks:
      - rti-network
    labels:
      - "rti.service=rti-fsp01"
      - "rti.type=RTI-FSP"
      - "rti.host=rti-fsp01"
      - "rti.port=5001"
    volumes:
        - ./modules/fsp01/models:/models
        - ./modules/fsp01/plugins.json:/plugins/plugins.json:ro
        - certs:/certs:ro

  # Second FSP instance
  rti-fsp02:
    image: ${RTI_IMAGE_REPO:-netbeheer-nederland/iec61850-websocket}/rti-fsp:${RTI_IMAGE_TAG:-latest}
    container_name: rti-fsp02
    ports:
      - "5005:5005"  # Map to different host port, same container port
    depends_on:
      cert-generator:
        condition: service_completed_successfully
    networks:
      - rti-network
    environment:
      PORT: 5005
      CP: cp2
      MODELPATH: /models/model_2.py
      LOG_LEVEL: debug
    volumes:
      - ./modules/fsp02/models:/models
      - certs:/certs:ro
    labels: # ✅ Add labels for consistency
      - "rti.service=rti-fsp02"
      - "rti.type=RTI-FSP"
      - "rti.host=rti-fsp02"
      - "rti.port=5005"

volumes:
  # Shared certificate store populated by cert-generator, mounted read-only
  # at /certs by every other service.
  certs:

networks:
  rti-network:
    driver: bridge
