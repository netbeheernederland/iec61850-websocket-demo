# rti-so (ACSI client / RTI-SO). Split out of the root docker-compose.yml.
# Host networking exposes 5000 (API) and 8765 (WebSocket) on the VM IP.
name: rti-so

services:
  rti-so:
    image: rti-demo_rti-so:latest
    container_name: rti-so
    network_mode: host
    environment:
      PORT: "5000"
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: debug
    volumes:
      - /etc/rti/certs:/certs:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
