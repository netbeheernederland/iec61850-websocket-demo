services:
  rti-so:
    image: netbeheer-nederland/iec61850-websocket/rti-so:latest
    container_name: rti-so
    ports:
      - "5000:5000"
      - "8765:8765"
    environment:
      - PORT=5000
      # The plugins it connects to (upstream decision 0029): the IO plugin
      # dr_panel, which writes input changes back to host_url, and the
      # sample plugin dr_leds.
      - 'PLUGINS={"host_url": "http://rti-so:5000", "plugins": [{"name": "dr_panel", "url": "http://dr-panel:9000/plugin"}, {"name": "dr_leds", "url": "http://dr-leds:8099/plugin"}]}'
    networks:
      - rti-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "rti.service=rti-so"
      - "rti.type=RTI-SO"
      - "rti.host=rti-so"
      - "rti.port=5000"

  dr-panel:
    image: netbeheer-nederland/iec61850-websocket/dr-panel:latest
    container_name: dr-panel
    ports:
      - "9000:9000"
    environment:
      - PORT=9000
    devices:
      - "/dev/gpiochip0:/dev/gpiochip0"
      - "/dev/gpiochip4:/dev/gpiochip4"
      - "/dev/gpiochip10:/dev/gpiochip10"
      - "/dev/gpiochip11:/dev/gpiochip11"
      - "/dev/gpiochip12:/dev/gpiochip12"
      - "/dev/gpiochip13:/dev/gpiochip13"
      # I2C (e.g. the SSD1306 OLED, decision 0024) and SPI, as upstream
      - "/dev/i2c-1:/dev/i2c-1"
      - "/dev/i2c-13:/dev/i2c-13"
      - "/dev/i2c-14:/dev/i2c-14"
      - "/dev/spidev0.0:/dev/spidev0.0"
      - "/dev/spidev0.1:/dev/spidev0.1"
    privileged: true
    ipc: host
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_RAWIO
    networks:
      - rti-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/api/io/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "rti.service=dr-panel"
      - "rti.type=RTI-IO"
      - "rti.host=dr-panel"
      - "rti.port=9000"

  # The sample plugin: two simulated LEDs, no hardware. Port 8099 and the
  # health check are set by its Dockerfile; nothing is published.
  dr-leds:
    image: netbeheer-nederland/iec61850-websocket/dr-leds:latest
    container_name: dr-leds
    networks:
      - rti-network
    restart: unless-stopped

networks:
  rti-network:
    driver: bridge
