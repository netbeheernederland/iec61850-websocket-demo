services:
  rti-so:
    image: netbeheer-nederland/iec61850-websocket/rti-so:latest
    container_name: rti-so
    ports:
      - "5002:5002"
      - "8765:8765"
    environment:
      - PORT=5002
      # The IO plugin, installed in the image, reaches the IO server, which
      # writes input changes back to ACSI_BASE_URL.
      - IO_URL=http://rti-so-io:8000
      - ACSI_BASE_URL=http://rti-so:5002
    networks:
      - rti-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "rti.service=rti-so"
      - "rti.type=RTI-SO"
      - "rti.host=rti-so"
      - "rti.port=5002"

  rti-so-io:
    image: netbeheer-nederland/iec61850-websocket/rti-io:latest
    container_name: rti-so-io
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    devices:
      - "/dev/gpiochip0:/dev/gpiochip0"
      - "/dev/gpiochip4:/dev/gpiochip4"
      - "/dev/gpiochip10:/dev/gpiochip10"
      - "/dev/gpiochip11:/dev/gpiochip11"
      - "/dev/gpiochip12:/dev/gpiochip12"
      - "/dev/gpiochip13:/dev/gpiochip13"
    privileged: true
    ipc: host
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_RAWIO
    networks:
      - rti-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/io/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "rti.service=demo_io"
      - "rti.type=GPIO-LED-Control"
      - "rti.host=demo_io_so"
      - "rti.port=8000"

networks:
  rti-network:
    driver: bridge
