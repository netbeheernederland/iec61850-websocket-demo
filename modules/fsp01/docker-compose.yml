services:
  rti-fsp:
    container_name: rti-fsp
    image: netbeheer-nederland/iec61850-websocket/rti-fsp:latest
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - CP=cp1
      - MODELPATH=/models/model_1.py
      # The IO plugin, installed in the image, reaches the IO server, which
      # writes input changes back to ACSI_BASE_URL.
      - IO_URL=http://rti_fsp_io:8000
      - ACSI_BASE_URL=http://rti-fsp:5001
    networks:
      - rti-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "rti.service=rti-fsp"
      - "rti.type=RTI-FSP"
      - "rti.host=rti-fsp"
      - "rti.port=5001"
    volumes:
      # models/ is copied next to this file by scripts/deploy-rti-demo.sh
      - ./models:/models

  rti_fsp_io:
    container_name: rti_fsp_io
    image: netbeheer-nederland/iec61850-websocket/rti-io:latest
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    devices:
      - "/dev/gpiochip0:/dev/gpiochip0"
      - "/dev/gpiochip4:/dev/gpiochip4"
      - "/dev/gpiochip10:/dev/gpiochip10"
      - "/dev/gpiochip11:/dev/gpiochip11"
      - "/dev/gpiochip12:/dev/gpiochip12"
      - "/dev/gpiochip13:/dev/gpiochip13"
      # I2C (e.g. the SSD1306 OLED, decision 0024) and SPI, as upstream
      - "/dev/i2c-1:/dev/i2c-1"
      - "/dev/i2c-13:/dev/i2c-13"
      - "/dev/i2c-14:/dev/i2c-14"
      - "/dev/spidev0.0:/dev/spidev0.0"
      - "/dev/spidev0.1:/dev/spidev0.1"
    privileged: true
    ipc: host
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_RAWIO
    networks:
      - rti-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/io/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "rti.service=demo_io"
      - "rti.type=GPIO-LED-Control"
      - "rti.host=demo_io_fsp"
      - "rti.port=8000"

networks:
  rti-network:
    driver: bridge
