# Role fsp: one rti-fsp, the sample plugin dr-leds and the IO plugin
# dr-panel (commented out), per machine. The
# per-machine values come from the .env file scripts/stage-rti-role.sh writes
# next to this file, from the --cp, --port and --model options of
# scripts/deploy-rti-demo.sh or setup/pi-user-data.sh --role.
services:
  rti-fsp:
    container_name: rti-fsp
    image: netbeheer-nederland/iec61850-websocket/rti-fsp:latest
    ports:
      - "${FSP_PORT:-5001}:${FSP_PORT:-5001}"
    environment:
      - PORT=${FSP_PORT:-5001}
      - CP=${FSP_CP:-cp1}
      # Empty (no --model): fsp's built-in default model
      - MODELPATH=${FSP_MODELPATH:-}
      # The plugins it connects to (upstream decision 0029): dr_leds. With
      # dr-panel below uncommented, use the second line: dr_panel writes input
      # changes back to host_url.
      - 'PLUGINS={"host_url": "http://rti-fsp:${FSP_PORT:-5001}", "plugins": [{"name": "dr_leds", "url": "http://dr-leds:8099/plugin"}]}'
      #- 'PLUGINS={"host_url": "http://rti-fsp:${FSP_PORT:-5001}", "plugins": [{"name": "dr_panel", "url": "http://dr-panel:9000/plugin"}, {"name": "dr_leds", "url": "http://dr-leds:8099/plugin"}]}'
    networks:
      - rti-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${FSP_PORT:-5001}/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "rti.service=rti-fsp"
      - "rti.type=RTI-FSP"
      - "rti.host=rti-fsp"
      - "rti.port=${FSP_PORT:-5001}"
    volumes:
      # The --model file is copied into models/ by scripts/stage-rti-role.sh
      - ./models:/models

  # The sample plugin: two simulated LEDs, no hardware. Port 8099 and the
  # health check are set by its Dockerfile; nothing is published.
  dr-leds:
    container_name: dr-leds
    image: netbeheer-nederland/iec61850-websocket/dr-leds:latest
    networks:
      - rti-network
    restart: unless-stopped

