# rti-fsp-cp2. Defaults: deploy/helm/rti-fsp/values.yaml

image:
  tag: latest            # pin sha-<commit> to control rollouts

imagePullSecrets:
  - name: ghcr-pull

cp: cp2
port: 5005

# Bundled in deploy/helm/rti-fsp/models/
model:
  file: model_2.py

# k3s ServiceLB: port 5005 on the nodes' IPs, like the compose files' host
# ports, for the BFF outside the cluster
service:
  type: LoadBalancer

# The IO plugin dr-panel on the same Pi (off, as in
# modules/fsp/docker-compose.yml);
# enabling it needs the pod pinned to that Pi
drPanel:
  enabled: false
#nodeSelector:
#  kubernetes.io/hostname: rti-pi5
