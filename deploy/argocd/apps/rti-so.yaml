# One Application per directory deploy/installations/so/<name>/, which holds
#   installation.yaml  where it goes (destination.server, destination.namespace)
#   values.yaml        Helm values for deploy/helm/rti-so
# Adding a directory adds an SO; removing it deletes the SO and its resources.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: rti-so
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/netbeheernederland/iec61850-websocket-demo.git
        revision: main
        files:
          - path: deploy/installations/so/*/installation.yaml
  template:
    metadata:
      name: "rti-so-{{ .path.basename }}"
      labels:
        app.kubernetes.io/part-of: rti-demo
        rti-demo/role: so
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: rti-demo
      source:
        repoURL: https://github.com/netbeheernederland/iec61850-websocket-demo.git
        targetRevision: main
        path: deploy/helm/rti-so
        helm:
          # Same as the Application name, so ArgoCD's app.kubernetes.io/instance
          # tracking label matches the chart's selector label
          releaseName: "rti-so-{{ .path.basename }}"
          valueFiles:
            # Relative to the chart directory
            - "../../../{{ .path.path }}/values.yaml"
      destination:
        server: "{{ .destination.server }}"
        namespace: "{{ .destination.namespace }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
