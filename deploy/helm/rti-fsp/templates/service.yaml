apiVersion: v1
kind: Service
metadata:
  name: {{ include "rti-fsp.fullname" . }}
  labels:
    {{- include "rti-fsp.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "rti-fsp.selectorLabels" . | nindent 4 }}
  ports:
    - name: acsi
      port: {{ .Values.port }}
      targetPort: acsi
      protocol: TCP
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
