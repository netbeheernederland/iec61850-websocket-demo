# Default values for rti-fsp. One release is one FSP: one control point,
# one pod. Per-installation values live in deploy/installations/fsp/<name>/.

nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/netbeheernederland/iec61850-websocket/rti-fsp
  # Pin a build (sha-<commit>) per installation: ArgoCD only rolls out a new
  # image when this value changes.
  tag: latest
  pullPolicy: IfNotPresent

# The images are public on GHCR: no pull secret needed. For a private
# registry, name a docker-registry secret created in the release's namespace.
imagePullSecrets: []
#  - name: ghcr-pull

# Control point this FSP serves (CP), and the ACSI server port (PORT)
cp: cp1
port: 5001
logLevel: debug

# The IEC 61850 model the FSP loads (MODELPATH).
#   file:    a model bundled in this chart's models/ directory, e.g.
#            model_1.py; empty, with no content, uses the image's built-in model
#   content: the model's Python source inline; overrides the bundled file of
#            the same name. Name it with file (default model.py).
model:
  file: ""
  content: ""

# Extra environment variables for the FSP container
extraEnv: []
#  - name: PYTHONUNBUFFERED
#    value: "1"

# Mount a secret with the mTLS certificates (ca.pem, server.pem, ...) at
# /certs, as the cert-generator volume is in docker-compose. Empty: none.
certs:
  secretName: ""

service:
  # ClusterIP for in-cluster clients; NodePort or LoadBalancer to reach the
  # FSP from the BFF outside the cluster.
  type: ClusterIP
  # Only for type NodePort; empty lets Kubernetes choose
  nodePort: ""
  annotations: {}

# The IO plugin dr-panel as a sidecar: same pod, so same node as the FSP,
# reached on localhost and connected as the plugin dr_panel. Needs a privileged
# container on a Pi with the GPIO, I2C and SPI devices; the namespace must
# allow privileged pods.
drPanel:
  enabled: false
  image:
    repository: ghcr.io/netbeheernederland/iec61850-websocket/dr-panel
    tag: latest
    pullPolicy: IfNotPresent
  port: 9000
  # The dr_panel plugin's settings, e.g. {write_inputs: false}
  settings: {}
  resources: {}

# More plugins to connect to (plugin API version 2, upstream decision 0029),
# after the sidecar's dr_panel entry. Each is {name, url, settings}, e.g. the
# dr-st7789v display:
#   - name: display_st7789
#     url: http://192.168.0.226:8000/plugin
#     settings: {}
plugins: []

# Where plugins write back to (the plugin configuration's host_url). Empty:
# http://localhost:<port>, which only a sidecar reaches; set it to this
# FSP's external address when a plugin in plugins runs outside the pod.
pluginHostUrl: ""

resources: {}

# The images are built for arm64 only (the Pis)
nodeSelector:
  kubernetes.io/arch: arm64
tolerations: []
affinity: {}

podAnnotations: {}
podLabels: {}
