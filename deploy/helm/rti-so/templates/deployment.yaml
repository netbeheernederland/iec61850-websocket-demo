apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rti-so.fullname" . }}
  labels:
    {{- include "rti-so.labels" . | nindent 4 }}
spec:
  # The IO sidecar owns the Pi's hardware: never run two pods of a release,
  # not even during a rollout.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "rti-so.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "rti-so.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.drPanel.enabled }}
      hostIPC: true
      {{- end }}
      containers:
        - name: rti-so
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: PORT
              value: {{ .Values.port | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            {{- with include "rti-so.pluginsJson" . }}
            # The plugins it connects to (upstream decision 0029)
            - name: PLUGINS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: api
              containerPort: {{ .Values.port }}
              protocol: TCP
            - name: websocket
              containerPort: {{ .Values.websocketPort }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /api/status
              port: api
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /api/status
              port: api
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/status
              port: api
            periodSeconds: 10
            timeoutSeconds: 10
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.certs.secretName }}
          volumeMounts:
            - name: certs
              mountPath: /certs
              readOnly: true
          {{- end }}
        {{- if .Values.drPanel.enabled }}
        - name: dr-panel
          image: "{{ .Values.drPanel.image.repository }}:{{ .Values.drPanel.image.tag }}"
          imagePullPolicy: {{ .Values.drPanel.image.pullPolicy }}
          env:
            - name: PORT
              value: {{ .Values.drPanel.port | quote }}
          ports:
            - name: dr-panel
              containerPort: {{ .Values.drPanel.port }}
              protocol: TCP
          # GPIO, I2C and SPI: a privileged container sees the host's /dev
          securityContext:
            privileged: true
            capabilities:
              add: ["SYS_RAWIO"]
          livenessProbe:
            httpGet:
              path: /api/io/health
              port: dr-panel
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          {{- with .Values.drPanel.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
      {{- if .Values.certs.secretName }}
      volumes:
        - name: certs
          secret:
            secretName: {{ .Values.certs.secretName }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
